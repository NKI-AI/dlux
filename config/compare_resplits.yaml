# @package _global_
defaults:
  # Both REQUIRED and cross-checked: the cohort must be one the study declares.
  - study: ???
  - cohort: ???
  - paths: default
  - hydra: default
  - _self_
  # REQUIRED, study-scoped: comparison=<study>/<name>. The SAME config `compare` uses — the arms and
  # the reference are one question asked at two levels of rigour, so they are stated once.
  - comparison: ???
  - optional local/paths: default
  - optional project/paths: default
  - optional local/misc: default
# Set by the chosen comparison config; do not set it here.
comparison_name: ???
arms: ???
reference: ???
# REQUIRED: names the sweep whose rows to read, matching RESPLIT_NAME in resplit_sweep.sh.
resplit_name: ???
fields: null # null = every endpoint the rows hold
hydra:
  # A consumer project supplies its own `catalog/` (cohorts, studies, experiments) and `config/`
  # (custom tasks/models + its cohort paths). Both are search-path roots. Repeated in every bin's
  # PRIMARY config because hydra needs the search path to find config groups at all, so it cannot
  # come from one.
  searchpath:
    - file://${dlux.project:}/catalog
    - file://${dlux.project:}/config
  run:
    dir: ${paths.log_dir}/${study.name}/compare_resplits/${resplit_name}/${now:%Y-%m-%d}_${now:%H-%M-%S-%f}
