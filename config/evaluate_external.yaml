# @package _global_
defaults:
  - study: ???
  - cohort: ???
  - paths: default
  - hydra: default
  - _self_
  - optional local/paths: default
  - optional project/paths: default
  - optional local/misc: default
# The development sweep's experiment_name — where best.ckpt live (studies/<study>/runs/<experiment>/<dev_cohort>/).
experiment_name: ???
hydra:
  # A consumer project supplies its own `catalog/` (cohorts, studies, experiments) and `config/`
  # (custom tasks/models + its cohort paths). Both are search-path roots. DLUX_PROJECT names the
  # project; `dlux.project` resolves a relative value from the repository root and fails if either
  # root is missing.
  searchpath:
    - file://${dlux.project:}/catalog
    - file://${dlux.project:}/config
  run:
    dir: ${paths.log_dir}/${study.name}/evaluate_external/${experiment_name}/${now:%Y-%m-%d}_${now:%H-%M-%S-%f}
# OPTIONAL narrowing: null/[] (default) scores every declared endpoint this cohort supports and external
# eval has a handler for; `only_fields=[er]` scores just that one. It selects among discovered runs — it
# is NOT a target declaration.
only_fields: null
# EXPRESSION significance null (optional): a random-baseline sweep's experiment_name (trained with
# `random_baseline: true`) under the SAME dev cohort. When set, the expression report adds SEQUOIA's
# conservative significant-gene count — trained vs random-init, per gene, on the external patients.
# Ignored for non-expression endpoints (they have a fixed chance floor). null = no null arm.
random_experiment: null
# Loader workers. The rest of the datamodule (batch sizes, min_tiles) is the run's own.
num_workers: 0
# Where a tile task runs its tiles through a Lightning Trainer. A slide task runs on the flow's own device.
trainer:
  accelerator: auto
  devices: 1
# Refuse to ensemble an incomplete development sweep. strict=false ensembles the models present.
strict: true
