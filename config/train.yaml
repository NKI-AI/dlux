# @package _global_
defaults:
  - train_base
  - _self_
hydra:
  # A consumer project supplies its own `catalog/` (cohorts, studies, experiments) and `config/`
  # (custom tasks/models + its cohort paths). Both are search-path roots. DLUX_PROJECT names the
  # project; `dlux.project` resolves a relative value from the repository root and fails if either
  # root is missing.
  searchpath:
    - file://${dlux.project:}/catalog
    - file://${dlux.project:}/config
