_target_: ahcore.mm_lit_module.MultiModalLightningModule
# RNA-ONLY: a ConcatFusion with a single bulk_rna branch (no tile branch). The task may still declare a
# tile_features input; ConcatFusion reads only the branch keys it has, so the tiles are ignored. The
# unimodal RNA comparator for a fusion experiment. The train bin sets the widths
# (dlux.models.build.size_model): num_classes from the task, the branch's input width from the active
# gene panel.
model:
  _target_: ahcore.models.fusion.fusion_mil.ConcatFusion
  num_classes: 1 # set by the train bin from the task
  classifier_hidden: []
  classifier_dropout: []
  classifier_activation:
    _target_: torch.nn.GELU
  branches:
    bulk_rna:
      _target_: ahcore.models.encoders.mlp_encoder.MLPEncoder
      input_dim: 1 # set by the train bin to the active gene-panel size
      output_dim: 256
      hidden: [512]
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]
