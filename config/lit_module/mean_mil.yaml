_target_: ahcore.mm_lit_module.MultiModalLightningModule
# MeanMIL: ab_mil with the attention branch replaced by an average over tiles. Every value below
# matches ab_mil.yaml (embed_dim = its attention_dim), so an arm swapping only `lit_module` isolates
# what attention contributes. Produces no attention artifact — there are no weights to persist.
model:
  _target_: ahcore.models.classifiers.mean_mil.MeanMIL
  input_key: tile_features # = the task's input name
  feature_dim: null # set by the train/eval bin from the .pack (like num_classes)
  num_classes: 1 # overridden per-endpoint by the train bin (task.num_classes)
  embed_mlp_hidden: []
  embed_mlp_dropout: []
  embed_dim: 256
  classifier_hidden: [] # linear head by default; a hidden layer (e.g. [128]) is an opt-in experiment
  classifier_dropout: []
  classifier_activation:
    _target_: torch.nn.GELU
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]
