# @package _global_
defaults:
  # Both REQUIRED and cross-checked: the cohort must be one the study declares.
  - study: ???
  - cohort: ???
  - tiling: 2mpp_224
  - paths: default
  - hydra: default
  - _self_
  - optional local/paths: default
  - optional project/paths: default
  - optional local/misc: default
hydra:
  # A consumer project supplies its own `catalog/` and `config/`. Both are search-path roots, as for
  # extract_features.
  searchpath:
    - file://${dlux.project:}/catalog
    - file://${dlux.project:}/config
  run:
    dir: ${paths.log_dir}/${study.name}/extract_tiles/${cohort.name}/${now:%Y-%m-%d}_${now:%H-%M-%S-%f}
# Where the tile cache goes. Training reads it through task.inputs.tiles.cache_root, which also defaults to
# the cohorts dir. A project that stages the cache on a node-local drive sets both.
tile_cache_root: ${paths.cohorts_dir}
limit: null # cache only the first N slides. The run then ends INCOMPLETE.
precomputer:
  batch_size: 32
  num_workers: 0 # tile readers per slide: threads for a streamed slide, forked workers for a local one
  only_missing: true # skip slides already cached or insufficient, and a READY cache
  jpeg_quality: 90
