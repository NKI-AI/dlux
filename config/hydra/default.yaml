# @package hydra
run:
  # Disposable per-run output dir. Each study-scoped bin overrides hydra.run.dir in its own config as
  # <study>/<bin>/<subject> (train: experiment/fold; aggregate/evaluate: experiment; build_db and
  # extraction: cohort). This fallback, grouped by job name, applies to the bins without a study
  # (generate_masks, serve_slides). Microsecond
  # precision (%f) keeps same-second reruns distinct; bins additionally write an atomic run_marker.json
  # to detect any residual collision loudly.
  dir: ${paths.log_dir}/${hydra.job.name}/${now:%Y-%m-%d}_${now:%H-%M-%S-%f}
job:
  chdir: false
