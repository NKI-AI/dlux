[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dlux"
dynamic = ["version"]
description = "Standalone WSI/multimodal classification and survival pipeline"
readme = "README.md"
authors = [
    { name = "Joren Brunekreef", email = "j.brunekreef@nki.nl" },
]
maintainers = [
    { name = "AI for Oncology", email = "j.teuwen@nki.nl" },
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# Pinned so a venv built from this project trains against the same tested stack. Loosen to floors when the
# public release no longer needs to match that stack exactly.
dependencies = [
    "ahcore==0.1.1",
    "hydra-core~=1.3",
    "imagecodecs>=2025",
    "imageio~=2.37",
    "lightning~=2.6",
    "matplotlib==3.10.9",
    "mlflow>=3.15",
    "numpy==2.4.6",
    "omegaconf~=2.3",
    "pandas~=2.2",
    "pillow==12.2.0",
    "pyarrow>=25.0.1",
    "pydantic~=2.10",
    "scikit-learn~=1.6",
    "seaborn~=0.13",
    "torch==2.10.0",
    "torchmetrics~=1.6",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# serve_slides: the tile-serving viewer.
viewer = ["fastapi", "fastslide==0.8.0", "uvicorn"]
# generate_masks: fetches the tissue-segmentation pack from HuggingFace.
masks = ["huggingface-hub~=0.28"]
# Everything, so one venv runs every bin/ endpoint.
all = ["dlux[viewer,masks]"]
dev = ["pytest>=7.0", "pytest-mock", "ruff", "mypy"]

[tool.hatch.version]
path = "dlux/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["dlux"]

[tool.hatch.build.targets.sdist]
include = [
    "dlux",
    "tests",
    "README.md",
    "pyproject.toml",
]
